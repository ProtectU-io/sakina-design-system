<style>
  :root:not([data-theme="dark"]) { --page: #dcd5cc; }
  body { margin: 0; font-family: Inter, sans-serif; background: var(--page); color: var(--page-text); }
  header { display: flex; align-items: center; gap: 24px; padding: 28px 48px; background: var(--midnight); color: var(--pearl); }
  header img { height: 52px; }
  header nav { margin-left: auto; display: flex; align-items: center; gap: 24px; }
  header nav a { color: var(--gold-light); }
  header nav a[aria-current] { text-decoration: none; opacity: .6; }
  .grid { display: flex; flex-wrap: wrap; gap: 48px 40px; padding: 40px 48px 80px; }
  /* One mockup per row on mobile; "safe" keeps the left edge reachable when the 390 px screen is wider than the viewport */
  @media (max-width: 720px) { .grid { justify-content: safe center; padding: 24px 16px 64px; } }
  figure { margin: 0; }
  figcaption { margin-bottom: 12px; font: 600 15px/20px Inter, sans-serif; }
  figcaption span { display: block; font-weight: 500; font-size: 12px; color: var(--page-muted); }

  /* Device screen: 390 x 844 logical points (iPhone 14/15) */
  .screen {
    position: relative; width: 390px; height: 844px; overflow: hidden;
    border-radius: 44px; box-shadow: 0 20px 50px rgb(20 32 78 / 0.25);
    background: var(--surface); color: var(--on-surface); font-family: Inter, sans-serif;
    display: flex; flex-direction: column;
  }
  .status { height: 54px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 32px 0; font: 600 16px/1 Inter, sans-serif; position: relative; z-index: 5; }
  .status .icons { display: flex; gap: 6px; }
  .status .icon { font-size: 18px; }
  .home-ind { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--on-surface); opacity: .8; z-index: 9; }
  .body { flex: 1; padding: 0 var(--s-lg); display: flex; flex-direction: column; min-height: 0; }
  .appbar { height: 56px; display: flex; align-items: center; gap: var(--s-sm); flex: none; }
  .iconbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .iconbtn.filled { background: var(--surface-card); box-shadow: var(--shadow); }

  /* Map layer */
  .map { position: absolute; inset: 0; }
  .map svg { width: 100%; height: 100%; display: block; }
  .light .map { --m-land: #efe8de; --m-block: #e4dbcf; --m-road: #fbf8f3; --m-major: #ffffff; --m-water: #b9d6ee; --m-park: #d7e3c8; --m-label: #8a8f99; }
  .dark .map { --m-land: #1c2a3d; --m-block: #223247; --m-road: #2d3f58; --m-major: #3a4f6c; --m-water: #16304f; --m-park: #1f3a36; --m-label: #7f8ea3; }
  .pin { position: absolute; transform: translate(-50%, -100%); }
  .me { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--sky); border: 4px solid #fff; box-shadow: 0 0 0 10px rgb(118 179 226 / 0.3); }

  /* Floating bottom area: alert FAB above NavigationBar */
  .bottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; }
  .bottom .navbar { padding-bottom: 14px; height: 84px; }
  .fab-sos { position: absolute; right: 20px; z-index: 7; }

  /* Modal bottom sheet */
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-radius: 28px 28px 0 0; padding: 12px var(--s-lg) 34px; box-shadow: 0 -8px 30px rgb(20 32 78 / 0.18); }
  .sheet .handle { width: 32px; height: 4px; border-radius: 2px; background: var(--outline); margin: 0 auto 16px; }
  .scrim { position: absolute; inset: 0; background: rgb(20 32 78 / 0.35); z-index: 5; }

  .stack { display: flex; flex-direction: column; gap: var(--s-md); }
  .hstack { display: flex; align-items: center; gap: var(--s-sm); }
  .grow { flex: 1; min-width: 0; }
  .tile { display: flex; align-items: center; gap: var(--s-md); padding: 14px 0; }
  .lead { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--primary-container); color: var(--on-primary-container); flex: none; }
  .badge { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border-radius: 999px; font: 600 12px/1 Inter, sans-serif; }
  .badge.ok { background: #dbe9df; color: var(--success); }
  .badge.live { background: rgb(118 179 226 / 0.2); color: var(--secondary); }
  .dots { display: flex; gap: 8px; justify-content: center; }
  .dots i { width: 8px; height: 8px; border-radius: 4px; background: var(--outline); }
  .dots i.on { width: 24px; background: var(--primary); }
  .photo { border-radius: var(--r-md); display: grid; place-items: center; color: rgb(255 255 255 / .9); flex: none; }
  /* Onboarding progress (3 segments) */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex: none; }
  .steps i { height: 4px; border-radius: 2px; background: var(--outline); }
  .steps i.on { background: var(--primary); }
  /* Checkbox */
  .check { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--outline); display: grid; place-items: center; flex: none; }
  /* Full-screen gradients: splash (01) and alert countdown (11) */
  .light.splash { background: radial-gradient(circle at 50% 42%, var(--ivory) 0, var(--pearl) 60%, #dcd2c5 100%); }
  .dark.splash { background: radial-gradient(circle at 50% 42%, #2c3f5c 0, var(--midnight) 60%, var(--navy) 100%); }
  .light.alert-bg { background: radial-gradient(circle at 50% 40%, var(--alert-soft) 0, var(--pearl) 55%, #dcd2c5 100%); }
  .dark.alert-bg { background: radial-gradient(circle at 50% 40%, #5a2f35 0, var(--midnight) 55%, var(--navy) 100%); }
  /* Logo variant per theme */
  .light .only-dark, .dark .only-light { display: none; }
  .apple { filter: brightness(0); }
  .dark .apple { filter: brightness(0) invert(1); }
  .check.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
</style>
</head>
